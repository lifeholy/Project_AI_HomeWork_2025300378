[package]
name = "checkserver"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
chrono = "0.4.45"
csv = "1.4.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11", "wayland"] }
egui_extras = "0.37.0"
encoding_rs = "0.8.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.3"
