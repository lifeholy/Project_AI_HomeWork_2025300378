[package]
name = "checkserver"
version = "3.0.0"
edition = "2021"
description = "AIRBOOK-FAS & EAI 서버 관제 (Rust GUI)"

[dependencies]
eframe = "0.29"
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
csv = "1"
encoding_rs = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
